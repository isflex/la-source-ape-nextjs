version: 1
applications:
  - appRoot: apps/gateway

    backend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare pnpm@latest-11 --activate
            - node bin/switch-zod-version.mjs 3
            - node bin/switch-graphql-version.mjs 15
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - ln -sf ../../pnpm-lock.yaml apps/gateway/pnpm-lock.yaml
            - cd apps/gateway
            - pnpm ampx info
            - pnpm ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --debug
      # cache:
      #   paths:
      #     - "node_modules/**/*"
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - cd ../../
            - node bin/switch-zod-version.mjs 4
            - node bin/switch-graphql-version.mjs 16
            - pnpm install --no-frozen-lockfile
        build:
          commands:
            - export FLEX_PROJ_ROOT=$(pwd)
            - export NEXT_PUBLIC_AWS_APP_ID=$AWS_APP_ID
            - pnpm build
            - rm -f node_modules/@rspack/binding-linux-x64-gnu/rspack.linux-x64-gnu.node
            - rm -f node_modules/@rspack/binding-linux-x64-musl/rspack.linux-x64-musl.node
      artifacts:
        baseDirectory: apps/gateway/.next
        files:
          - "**/*"
      cache:
        paths:
          - "apps/gateway/.next/cache/**/*"
          # - "node_modules/**/*"
