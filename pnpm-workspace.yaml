packages:
  - "apps/**"
  - "!apps/gateway/.next/standalone/**"
  # - "!apps/gateway/amplify/**"
  - "packages/**"
packageExtensions:
  "@aws-amplify/backend-cli":
    dependencies:
      tsx: "^4.19.4"
allowBuilds:
  "@parcel/watcher": true # required for @tailwindcss/cli
  "@scarf/scarf": false
  core-js: false
  cypress: false
  esbuild: false
  protobufjs: false
  sharp: false
  ttf2woff2: false
  unrs-resolver: false
patchedDependencies:
  aws-cdk-lib@2.253.1: patches/aws-cdk-lib@2.253.1.patch
